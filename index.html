<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SpendWise - track your income and expenses with a simple dashboard.">
  <title>SpendWise | Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="dashboard">
  <header class="site-header">
    <nav class="nav">
      <a class="brand" href="index.html"><img src="images/favicon.svg" alt="">SpendWise</a>
      <ul class="nav-links">
        <li><a class="active" href="index.html">Dashboard</a></li>
        <li><a href="transactions.html">Transactions</a></li>
        <li><a href="about.html">About</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>Dashboard</h1>
    <p class="subtitle">Your money at a glance.</p>

    <section class="summary" aria-label="Summary">
      <div class="card"><div class="label">Total income</div><div class="value income" id="total-income">KES 0</div></div>
      <div class="card"><div class="label">Total expenses</div><div class="value expense" id="total-expense">KES 0</div></div>
      <div class="card"><div class="label">Balance</div><div class="value" id="total-balance">KES 0</div></div>
    </section>

    <div class="grid-2">
      <section class="card">
        <h2>Spending by category</h2>
        <div id="category-breakdown"></div>
      </section>
      <section class="card">
        <h2>Recent transactions</h2>
        <ul class="tx-list" id="recent-list"></ul>
        <p style="margin-top:.75rem"><a href="transactions.html">View all transactions &rarr;</a></p>
      </section>
    </div>
  </main>

  <footer>&copy; <span id="year">2026</span> SpendWise. Built as a deployment project.</footer>
  <script src="js/app.js"></script>
</body>
</html>
